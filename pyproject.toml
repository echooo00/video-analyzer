[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-analyzer"
version = "1.0.0"
description = "本地视频内容识别与要点总结工具"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Video Analyzer"}]

dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pillow>=9.0",
    "imagehash>=4.3",
    "imageio>=2.25",
    "numpy>=1.21",
    "gradio>=4.0",
    "opencv-python>=4.6",
    "openai-whisper>=20231117",
]

[project.scripts]
video-analyzer = "video_analyzer.cli:main"
video-analyzer-web = "video_analyzer.web_ui:main"

[project.optional-dependencies]
faster = ["faster-whisper>=1.0"]

[tool.setuptools.packages.find]
include = ["video_analyzer*"]

[tool.setuptools.package-data]
video_analyzer = [".env", ".env.example"]
